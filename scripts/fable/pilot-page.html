<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* One column at night: the reel with a film-frame counter and steps, jumps to its key moments,
     the key drawings, then the questions. */
  :root {
    --night: #12141a;
    --panel: #1b1e26;
    --line: #2c303b;
    --moon: #ebe5d3;
    --dim: #a19d92;
    --fox: #e07b36;
    --keep: #9cc39a;
    --display: "Newsreader", Georgia, "Times New Roman", serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--night); color: var(--moon); font: 16px/1.55 var(--body); margin: 0; }
  main {
    max-width: 760px; margin: 0 auto;
    padding-block: 36px 72px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; gap: 32px;
  }
  h1 { font: 500 2rem/1.15 var(--display); margin: 0; text-wrap: balance; }
  h2 { font: 500 1.25rem/1.3 var(--display); margin: 0 0 8px; text-wrap: balance; }
  p { margin: 0; }
  .lede { color: var(--dim); margin-top: 8px; max-width: 68ch; }
  ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 70ch; }
  .small { color: var(--dim); font-size: 0.85rem; }
  .film { display: grid; gap: 10px; justify-items: center; }
  video { width: 100%; max-width: 520px; aspect-ratio: 4 / 5; background: #000; border-radius: 8px; display: block; }
  .bar { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; width: 100%; max-width: 520px; }
  .bar button, .jumps button {
    font: 500 0.9rem var(--body); color: var(--moon); background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 14px; min-height: 40px; cursor: pointer;
  }
  .bar button:hover, .jumps button:hover { border-color: var(--dim); }
  .frame { font: 500 0.95rem var(--mono); color: var(--fox); min-width: 0; text-align: center; }
  .frame span { display: block; color: var(--dim); font: 400 0.8rem var(--body); }
  .jumps { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
  figure img { width: 100%; height: auto; display: block; border-radius: 8px; cursor: zoom-in; background: #000; }
  figcaption { color: var(--dim); font-size: 0.85rem; }
  table { border-collapse: collapse; font-size: 0.9rem; width: 100%; }
  .scroll { overflow-x: auto; }
  td, th { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 500; }
  td.n { font-family: var(--mono); color: var(--fox); white-space: nowrap; }
  .marks { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .marks button { font: 500 0.9rem var(--body); color: var(--dim); background: transparent; border: 0; padding: 7px 14px; min-height: 36px; cursor: pointer; }
  .marks button + button { border-left: 1px solid var(--line); }
  .marks button[aria-pressed="true"] { color: var(--night); background: var(--moon); }
  .marks button.keep[aria-pressed="true"] { background: var(--keep); }
  button:focus-visible { outline: 2px solid var(--fox); outline-offset: 2px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .actions button { font: 500 1rem var(--body); border-radius: 8px; padding: 10px 16px; min-height: 44px; cursor: pointer; border: 1px solid var(--fox); background: var(--fox); color: var(--night); }
  .status { color: var(--dim); font-size: 0.9rem; }
  textarea { width: 100%; min-height: 6rem; font: 0.9rem/1.5 var(--body); color: var(--moon); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  textarea.out { font: 0.85rem/1.5 var(--mono); }
  .full { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); display: grid; place-items: center; overflow: auto; z-index: 20;
          padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); cursor: zoom-out; }
  .full img { max-width: none; width: min(2000px, 220vw); height: auto; }
</style>

<main>
  <header>
    <h1>__HEADING__</h1>
    <p class="lede">__LEDE__</p>
  </header>

  <section class="film">
    <video id="film" controls playsinline preload="auto"></video>
    <div class="bar">
      <button type="button" id="back" aria-label="Back one frame">&#9664; frame</button>
      <div class="frame" id="frame" aria-live="off">film frame <b id="fn">3080</b> <span id="fs"></span></div>
      <button type="button" id="fwd" aria-label="Forward one frame">frame &#9654;</button>
    </div>
    <div class="jumps" id="jumps"></div>
    <p class="small">Sound plays once you press play. The steps pause the film and move one frame (1/24 s).</p>
  </section>

  <section>
    <h2>What to look for</h2>
    <ul>
<!--NOTES-->
    </ul>
  </section>

  <section>
    <h2>The key drawings</h2>
    <figure id="strip"></figure>
  </section>

  <section>
    <h2>The exposure sheet</h2>
    <div class="scroll"><table id="sheet"><thead><tr><th>Frames</th><th>He</th><th>Around him</th></tr></thead><tbody></tbody></table></div>
  </section>

  <div id="asks" style="display:grid;gap:20px"></div>

  <section>
    <h2>Anything else</h2>
    <p class="small" style="margin:0 0 6px">Say where by film frame if you can: the counter under the film shows it.</p>
    <textarea id="notes" aria-label="Notes on the blocking"></textarea>
  </section>

  <section>
    <div class="actions">
      <button type="button" id="copy">Copy my choices</button>
      <span class="status" id="status" aria-live="polite"></span>
    </div>
    <textarea id="summary" class="out" aria-label="Your choices, to paste back to Claude" readonly hidden></textarea>
  </section>
</main>

<script>
const DATA = /*DATA*/{};
const KEY = `fox-moon-pilot-${DATA.key}`;
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* choices just won't persist */ } };
const state = load();

const film = document.getElementById('film');
for (const s of DATA.sources) {
  const el = document.createElement('source');
  el.src = s.uri; el.type = s.type;
  film.append(el);
}
const fn = document.getElementById('fn');
const fs = document.getElementById('fs');
const frameAt = () => DATA.first + Math.min(DATA.count - 1, Math.max(0, Math.floor(film.currentTime * DATA.fps + 1e-3)));
function show() {
  const f = frameAt();
  fn.textContent = f;
  const label = DATA.labels.find((l) => f >= l.from && f <= l.to);
  fs.textContent = label ? label.name : '';
}
film.addEventListener('timeupdate', show);
film.addEventListener('seeked', show);
const seekFrame = (f) => {
  film.pause();
  const n = Math.min(DATA.count - 1, Math.max(0, f - DATA.first));
  film.currentTime = (n + 0.5) / DATA.fps;
};
document.getElementById('back').addEventListener('click', () => seekFrame(frameAt() - 1));
document.getElementById('fwd').addEventListener('click', () => seekFrame(frameAt() + 1));
(function step() { if (!film.paused) show(); requestAnimationFrame(step); })();

const jumps = document.getElementById('jumps');
for (const j of DATA.jumps) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = `${j.label} (${j.frame})`;
  b.addEventListener('click', () => seekFrame(j.frame));
  jumps.append(b);
}

const strip = document.getElementById('strip');
const img = document.createElement('img');
img.src = DATA.strip; img.alt = 'The key drawings of the blocking, labelled with their film frames';
img.addEventListener('click', () => {
  const d = document.createElement('div');
  d.className = 'full';
  const big = document.createElement('img');
  big.src = DATA.strip; big.alt = img.alt;
  d.append(big);
  d.addEventListener('click', () => d.remove());
  document.body.append(d);
});
const cap = document.createElement('figcaption');
cap.textContent = 'Tap to see it full size. Each is labelled with its film frame.';
strip.append(img, cap);

const tbody = document.querySelector('#sheet tbody');
for (const r of DATA.sheet) {
  const tr = document.createElement('tr');
  for (const [i, v] of r.entries()) {
    const td = document.createElement('td');
    if (i === 0) td.className = 'n';
    td.textContent = v;
    tr.append(td);
  }
  tbody.append(tr);
}

const asksEl = document.getElementById('asks');
for (const q of DATA.asks) {
  const sec = document.createElement('section');
  sec.innerHTML = '<h2></h2><div class="marks" role="group"></div>';
  sec.querySelector('h2').textContent = q.title;
  const row = sec.querySelector('.marks');
  row.setAttribute('aria-label', q.title);
  for (const o of q.options) {
    const b = document.createElement('button');
    b.type = 'button'; b.dataset.q = q.key; b.dataset.a = o.value;
    if (o.keep) b.className = 'keep';
    b.setAttribute('aria-pressed', 'false');
    b.textContent = o.label;
    b.addEventListener('click', () => { state[q.key] = o.value; save(); paint(); });
    row.append(b);
  }
  asksEl.append(sec);
}

const notes = document.getElementById('notes');
notes.value = state.notes ?? '';
notes.addEventListener('input', () => { state.notes = notes.value; save(); });
const status = document.getElementById('status');
function paint() {
  document.querySelectorAll('[data-q]').forEach((b) => b.setAttribute('aria-pressed', String(state[b.dataset.q] === b.dataset.a)));
  const left = DATA.asks.filter((q) => !state[q.key]).length;
  status.textContent = left ? `${left} question${left === 1 ? '' : 's'} still to answer` : 'All answered';
}
const summary = document.getElementById('summary');
document.getElementById('copy').addEventListener('click', () => {
  const lines = [DATA.copyTitle, ...DATA.asks.map((q) => `${q.short}: ${state[q.key] ?? '-'}`)];
  if (state.notes?.trim()) lines.push(`Notes: ${state.notes.trim()}`);
  const text = lines.join('\n');
  summary.value = text;
  summary.hidden = false;
  const fallback = () => { summary.focus(); summary.select(); status.textContent = 'Copy the selected text'; };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(() => { status.textContent = 'Copied. Paste it into the chat.'; }, fallback);
  else fallback();
});
paint();
show();
</script>
